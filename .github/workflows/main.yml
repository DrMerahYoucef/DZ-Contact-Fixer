name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Test & Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for unit tests
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_ALIAS: ${{ vars.RELEASE_ALIAS || secrets.RELEASE_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing secret RELEASE_SIGNING_PASSWORD"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing secret RELEASE_KEY_PASSWORD"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"

          if [ "$RELEASE_ALIAS" != "upload" ]; then
            echo "::warning::RELEASE_ALIAS is '$RELEASE_ALIAS', while app/build.gradle.kts uses keyAlias 'upload'."
          fi

          keytool -list \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$RELEASE_ALIAS" > /dev/null

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare & verify release APK
        id: apk
        run: |
          set -euo pipefail
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_APK" ]; then
            echo "::error::Expected release APK not found at $RAW_APK"
            exit 1
          fi

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION_SUFFIX="${GITHUB_REF_NAME}"
          else
            VERSION_SUFFIX="${GITHUB_SHA::7}"
          fi

          mkdir -p release-output
          OUT_APK="release-output/dz-contact-fixer-${VERSION_SUFFIX}.apk"
          cp "$RAW_APK" "$OUT_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT_APK"
          fi

          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=dz-contact-fixer-${VERSION_SUFFIX}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dz-contact-fixer-release-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DZ Contact Fixer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_path }}

      - name: Clean up decoded keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks" "${{ github.workspace }}/debug.keystore"
